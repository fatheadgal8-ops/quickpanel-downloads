name: Build Mac app

# Builds the QuickPanel Mac app on a GitHub Mac and attaches QuickPanel.dmg to your release.
# Run it from the "Actions" tab -> "Build Mac app" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach the Mac app to"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: quickpanel-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build the app (works on both Apple Silicon and Intel Macs)
        run: npx electron-builder --mac --universal --dir

      - name: Check, sign and package
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -type d -name "QuickPanel.app" | grep -v temp | head -n 1 || true)
          if [ -z "$APP" ]; then echo "Could not find the built app. Contents of dist:"; ls -R dist | head -50; exit 1; fi
          echo "Built app: $APP"

          ARCHS=$(lipo -archs "$APP/Contents/MacOS/QuickPanel")
          echo "Architectures inside: $ARCHS"
          echo "$ARCHS" | grep -q arm64  || { echo "Missing Apple Silicon (arm64) support"; exit 1; }
          echo "$ARCHS" | grep -q x86_64 || { echo "Missing Intel (x86_64) support"; exit 1; }

          # Sign the finished app so it launches on Apple Silicon Macs
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Disk image: the app plus a shortcut to Applications to drag it onto
          rm -rf dmgroot && mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "QuickPanel" -srcfolder dmgroot -ov -format UDZO QuickPanel.dmg
          ls -la QuickPanel.dmg

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: QuickPanel-mac
          path: quickpanel-desktop/QuickPanel.dmg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" QuickPanel.dmg --clobber --repo "${{ github.repository }}"
